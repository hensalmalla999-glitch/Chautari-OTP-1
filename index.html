<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chautari - Phone Verification</title>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f5ff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      background: white;
      width: 85%;
      max-width: 380px;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 25px #0002;
    }

    h2 { text-align: center; color: #1769ff; }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 9px 0;
      border-radius: 9px;
      font-size: 16px;
    }

    input { border: 1px solid #bbb; }

    button {
      border: none;
      background: #1769ff;
      color: white;
      font-weight: bold;
    }

    button:disabled { background: #aaa; }

    #status { text-align: center; font-size: 14px; }
    #next { display: none; background: #168447; }

    #recaptcha-container { margin: 10px 0; }
  </style>
</head>

<body>
  <div class="box">
    <h2>Chautari</h2>
    <p>Verify your phone number to create an account.</p>

    <label>Phone Number (with country code)</label>
    <input id="phone" type="tel" placeholder="+919876543210">

    <div id="recaptcha-container"></div>

    <button id="send" onclick="sendOTP()">Send OTP</button>

    <div id="otpArea" style="display:none">
      <label>Enter OTP</label>
      <input id="otp" type="number" placeholder="6-digit OTP">
      <button id="verify" onclick="verifyOTP()">Verify OTP</button>
    </div>

    <p id="status" aria-live="polite"></p>

    <button id="next" onclick="goNext()">Next</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAwqnHugymlNkrB92G2KwWQG15wvTHIciE",
      authDomain: "chautari-otp.firebaseapp.com",
      projectId: "chautari-otp",
      storageBucket: "chautari-otp.firebasestorage.app",
      messagingSenderId: "118562250321",
      appId: "1:118562250321:web:9125c300bc85a14d042270",
      measurementId: "G-W24KPDTZVG"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    auth.useDeviceLanguage();

    let confirmationResult = null;
    let verified = false;
    let recaptchaVerifier = null;

    const status = document.getElementById("status");

    function showError(error) {
      status.textContent = error.message || "Something went wrong.";
    }

    function createRecaptcha() {
      if (recaptchaVerifier) return;

      recaptchaVerifier = new firebase.auth.RecaptchaVerifier(
        "recaptcha-container",
        {
          size: "normal",
          callback: function() {
            status.textContent = "Captcha verified. You can send OTP.";
          },
          "expired-callback": function() {
            status.textContent = "Captcha expired. Please verify again.";
          }
        }
      );

      recaptchaVerifier.render().catch(showError);
    }

    async function sendOTP() {
      const phone = document.getElementById("phone").value.trim();

      if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
        status.textContent = "Enter a valid phone number with country code, e.g. +91...";
        return;
      }

      document.getElementById("send").disabled = true;
      status.textContent = "Sending OTP...";

      try {
        createRecaptcha();
        await recaptchaVerifier.render();

        confirmationResult = await auth.signInWithPhoneNumber(
          phone,
          recaptchaVerifier
        );

        document.getElementById("otpArea").style.display = "block";
        status.textContent = "OTP sent. Check your SMS.";
      } catch (error) {
        showError(error);

        if (recaptchaVerifier) {
          recaptchaVerifier.clear();
          recaptchaVerifier = null;
          document.getElementById("recaptcha-container").innerHTML = "";
        }
      } finally {
        document.getElementById("send").disabled = false;
      }
    }

    async function verifyOTP() {
      const code = document.getElementById("otp").value.trim();

      if (!confirmationResult || !/^\d{6}$/.test(code)) {
        status.textContent = "Enter the 6-digit OTP received by SMS.";
        return;
      }

      document.getElementById("verify").disabled = true;
      status.textContent = "Verifying OTP...";

      try {
        await confirmationResult.confirm(code);
        verified = true;

        status.textContent = "✅ Phone number verified successfully!";
        document.getElementById("phone").disabled = true;
        document.getElementById("otpArea").style.display = "none";
        document.getElementById("send").style.display = "none";
        document.getElementById("recaptcha-container").style.display = "none";
        document.getElementById("next").style.display = "block";
      } catch (error) {
        showError(error);
      } finally {
        document.getElementById("verify").disabled = false;
      }
    }

    function goNext() {
      if (!verified) {
        status.textContent = "Please verify your phone number first.";
        return;
      }

      // Temporary demonstration: proceed to password setup.
      document.querySelector(".box").innerHTML = `
        <h2>Chautari</h2>
        <h3>Phone Verified ✅</h3>
        <p>Next: Password Setup</p>
        <input type="password" id="password"
          placeholder="Create password" autocomplete="new-password">
        <input type="password" id="confirmPassword"
          placeholder="Confirm password" autocomplete="new-password">
        <button onclick="checkPassword()">Continue</button>
        <p id="passwordStatus" aria-live="polite"></p>
      `;
    }

    function checkPassword() {
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirmPassword").value;
      const result = document.getElementById("passwordStatus");

      if (password.length < 8) {
        result.textContent = "Password must be at least 8 characters.";
      } else if (password !== confirm) {
        result.textContent = "Passwords do not match.";
      } else {
        result.textContent =
          "Password format accepted. Account creation backend is still required.";
      }
    }

    createRecaptcha();
  </script>
</body>
  </html>
